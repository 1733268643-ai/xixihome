<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>梦境穹顶</title>
<style>
:root{--ink:#413A4E;--muted:#8E86A0;
  --serif:"Iowan Old Style",Palatino,"Songti SC",Georgia,serif;
  --sans:-apple-system,"SF Pro Text","PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#C3C4E4}
canvas{display:block;touch-action:none}

#hud{position:fixed;left:18px;top:calc(env(safe-area-inset-top) + 54px);z-index:5;pointer-events:none}
#hud .eb{font-family:var(--mono);font-size:10px;letter-spacing:.22em;
  color:rgba(65,58,78,.55);text-transform:uppercase}
#hud h1{font-family:var(--serif);font-size:21px;font-weight:400;color:var(--ink);margin-top:3px;
  text-shadow:0 1px 14px rgba(255,247,225,.75)}
#hud .cnt{font-size:10.5px;color:var(--muted);margin-top:3px}

#exit{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 14px);z-index:9;
  font:13px var(--sans);color:#5A5270;text-decoration:none;
  background:rgba(255,253,249,.6);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.8);padding:8px 14px;border-radius:18px}

#filters{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 62px);z-index:6;
  display:flex;gap:7px;justify-content:center}
#filters button{font:inherit;font-size:11px;padding:6px 15px;border-radius:16px;cursor:pointer;
  border:1px solid rgba(255,255,255,.7);background:rgba(255,253,249,.5);
  backdrop-filter:blur(10px);color:#5A5270}
#filters button.on{background:rgba(255,253,249,.92);border-color:#fff;color:#413A4E}

#tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:5;
  text-align:center;font-size:11px;color:rgba(65,58,78,.5);pointer-events:none;line-height:1.8;
  text-shadow:0 1px 8px rgba(255,255,255,.6);transition:opacity .4s}

#card{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:8;
  background:rgba(255,253,249,.9);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.92);border-radius:22px;padding:16px 18px;
  box-shadow:0 26px 56px -18px rgba(90,80,120,.45);
  opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .35s,transform .35s}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card .dt{display:flex;align-items:baseline;gap:8px}
#card .dt b{font-family:var(--serif);font-weight:500;font-size:15px;color:var(--ink)}
#card .dt .when{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--muted)}
#card .dt .x{margin-left:10px;cursor:pointer;color:var(--muted);font-size:15px;line-height:1}
#card .meta{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
#card .meta em{font-style:normal;font-size:10px;padding:3px 8px;border-radius:9px;
  background:rgba(142,134,160,.13);color:var(--ink)}
#card .meta em.gold{background:rgba(245,197,107,.24);color:#8A6420}
#card .body{margin-top:11px;font-size:12.5px;line-height:1.82;color:var(--ink);
  max-height:26vh;overflow-y:auto}
#card .res{margin-top:10px;font-family:var(--serif);font-style:italic;font-size:12px;
  line-height:1.72;color:#7B7390;padding-top:9px;border-top:1px dashed rgba(142,134,160,.32)}
#card .lucid{margin-top:10px;padding:11px 13px;border-radius:15px;background:rgba(140,123,192,.09);
  font-size:11.5px;line-height:1.78;color:#5F5878}
#card .lucid b{display:block;font-family:var(--mono);font-weight:400;font-size:8.5px;
  letter-spacing:.18em;color:#8C7BC0;margin-bottom:5px}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head><body>
<a id="exit" href="/">&lsaquo; 回家</a>
<div id="hud">
  <div class="eb">Dreamscape</div>
  <h1>梦境穹顶</h1>
  <div class="cnt" id="cnt">正在起云…</div>
</div>
<div id="filters">
  <button data-n="6">最近 6</button><button data-n="12">12</button><button data-n="0" class="on">全部</button>
</div>
<div id="tip">拖动环视 · 双指缩放 · 轻点一朵云<br>不动它，云自己慢慢飘</div>
<div id="card">
  <div class="dt"><b id="c-t"></b><span class="when" id="c-w"></span><span class="x" id="c-x">&times;</span></div>
  <div class="meta" id="c-m"></div>
  <div class="body" id="c-b"></div>
  <div class="res" id="c-r"></div>
  <div class="lucid" id="c-l"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let DREAMS = [];

// 静态站（guchuan-1）没有 /api，要打到后端；本地开发走 vite 代理
const API_BASE = location.hostname.endsWith('.onrender.com') ? 'https://guchuan.onrender.com' : '';
const res = await fetch(API_BASE + '/api/mind/dreams', {
  headers: { 'x-access-password': localStorage.getItem('pai_pw') || '' },
});
const payload = await res.json().catch(() => ({}));
DREAMS = (payload.dreams || []).filter((d) => d.dream);
if (!DREAMS.length) {
  document.getElementById('cnt').textContent =
    payload.available === false ? '心潮还没接上 —— 不显示假数据' : '还没有梦';
}

/* ── 场景 ───────────────────────────────────────────── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(82, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 4, 7);            // 站在穹顶正中，抬头看天

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ── 天空穹顶：从头顶的暖金，过地平线的粉，到底下的梦紫 ── */
/* ── 天空：跟她此刻的真实时间同步 ──
   太阳有真实方位，转到背光那侧天色就沉下来——不是各向同性的贴纸。
   他的梦发生在夜里，但她什么时候看，天就是什么时候的天。 */
function sunAt(date){
  const h = date.getHours() + date.getMinutes()/60;
  // 6 点日出、12 点最高、18 点日落（杭州夏天大致如此）
  const elev = Math.sin((h - 6) / 12 * Math.PI) * 0.74;   // 正午约 68°，不到天顶
  const azim = (h / 24) * Math.PI * 2 - Math.PI * 0.5;     // 东→西
  const c = Math.cos(elev * Math.PI * 0.5);
  return {
    dir: new THREE.Vector3(Math.cos(azim) * c, Math.sin(elev * Math.PI * 0.5), Math.sin(azim) * c).normalize(),
    day: THREE.MathUtils.clamp(elev * 1.6 + 0.5, 0, 1),   // 0 深夜 → 1 正午
    dusk: THREE.MathUtils.clamp(1 - Math.abs(elev) * 3.2, 0, 1),  // 日出日落时最高
  };
}
let SUN = sunAt(new Date());

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    t: { value: 0 },
    sunDir: { value: SUN.dir.clone() },
    day: { value: SUN.day },
    dusk: { value: SUN.dusk },
  },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vP;
    uniform float t, day, dusk;
    uniform vec3 sunDir;

    // 便宜的哈希噪声，给夜空撒星
    float hash(vec3 p){ return fract(sin(dot(p, vec3(12.99, 78.23, 45.16))) * 43758.545); }

    void main(){
      vec3 d = normalize(vP);
      float h = d.y;                                  // -1 脚下 → 1 天顶
      float toSun = max(dot(d, sunDir), 0.0);         // 朝太阳 = 1，背光 = 0

      // 三档天色：夜 / 昼 / 晨昏
      vec3 nZen = vec3(0.286, 0.290, 0.478);
      vec3 nHor = vec3(0.478, 0.435, 0.596);
      vec3 dZen = vec3(0.812, 0.867, 0.965);
      vec3 dHor = vec3(0.988, 0.925, 0.847);
      vec3 kZen = vec3(0.678, 0.616, 0.816);
      vec3 kHor = vec3(0.996, 0.780, 0.643);

      float up = smoothstep(-0.15, 0.75, h);
      vec3 night = mix(nHor, nZen, up);
      vec3 dayc  = mix(dHor, dZen, up);
      vec3 duskc = mix(kHor, kZen, up);

      vec3 c = mix(night, dayc, day);
      c = mix(c, duskc, dusk * 0.75);                 // 晨昏染一层橘粉

      // 太阳那一侧亮起来——这才有方位感
      vec3 warm = mix(vec3(1.0, 0.80, 0.55), vec3(1.0, 0.96, 0.88), day);
      // 大范围辉光：指数小=铺得开，转过去才感觉得到方位
      c += warm * pow(toSun, 1.5) * (0.20 + dusk * 0.34) * (0.30 + day * 0.70);
      c += warm * pow(toSun, 6.0) * (0.14 + dusk * 0.26);
      c += warm * pow(toSun, 40.0) * (0.55 + dusk * 0.45);      // 日轮

      // 背光那侧压暗一点，转过去能感觉到
      // 背光半天压冷压暗，跟迎光侧拉开
      float away = max(-dot(d, sunDir), 0.0);
      c -= vec3(0.085, 0.075, 0.035) * pow(away, 1.2) * (0.45 + day * 0.55);
      c = mix(c, c * vec3(0.94, 0.96, 1.06), away * 0.5);

      // 夜里才有星
      float star = step(0.9975, hash(floor(d * 260.0)));
      c += vec3(star) * (1.0 - day) * max(h, 0.0) * (0.7 + 0.3 * sin(t * 1.6 + hash(floor(d * 90.0)) * 30.0));

      gl_FragColor = vec4(c, 1.0);
    }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 40, 32), skyMat));

/* ── 云的纹理：canvas 画的，不贴图 ──
   十几个柔和圆团聚成一朵，顶亮底暗，边缘羽化。
   同一个 seed 每次形状一样，她能认出"那朵云"。 */
/* 拿梦的 id 生成 0..1 的确定性抖动：同一个梦永远飘在同一个位置，
   但整片天看起来是自然散开的，不是排队 */
function jitter(str, salt){
  let h = salt >>> 0;
  const t = String(str || 'x');
  for (let i = 0; i < t.length; i++) h = (Math.imul(h, 31) + t.charCodeAt(i)) >>> 0;
  return ((h ^ (h >>> 13)) % 100000) / 100000;
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function cloudTexture(seed){
  const S = 640, c = document.createElement('canvas');
  c.width = S; c.height = Math.round(S*0.62);
  const x = c.getContext('2d'), H = c.height, rnd = mulberry32(seed);
  const n = 13 + Math.floor(rnd()*7);
  for (let i=0;i<n;i++){
    const t = i/(n-1);
    const arch = Math.sin(t*Math.PI);                       // 中间鼓、两头收
    const px = (0.13 + t*0.74 + (rnd()-0.5)*0.07) * S;
    const py = (0.70 - arch*0.24 + (rnd()-0.5)*0.07) * H;
    const pr = (0.10 + arch*0.17 + rnd()*0.06) * S;
    const g = x.createRadialGradient(px, py-pr*0.35, pr*0.06, px, py, pr);
    g.addColorStop(0.0,'rgba(255,255,255,1)');
    g.addColorStop(0.52,'rgba(255,254,252,.97)');
    g.addColorStop(0.82,'rgba(250,246,255,.45)');
    g.addColorStop(1.0,'rgba(248,244,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px,py,pr,0,Math.PI*2); x.fill();
  }
  // 底部压一层淡影，云才有厚度
  const sh = x.createLinearGradient(0,H*0.52,0,H);
  sh.addColorStop(0,'rgba(150,140,180,0)');
  sh.addColorStop(1,'rgba(126,114,168,.34)');
  x.globalCompositeOperation='source-atop';
  x.fillStyle = sh; x.fillRect(0,0,S,H);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const TEX = [0,1,2,3,4,5].map(i=>cloudTexture(i*977+13));

/* ── 布云 ──
   新梦：近、低、大、实；旧梦：远、高、小、淡 —— 正在飘走。 */
const GOLD = Math.PI * (3 - Math.sqrt(5));
const clouds = [];
const N = DREAMS.length;

DREAMS.forEach((d, i) => {
  const age = N > 1 ? i/(N-1) : 0;                 // 0 最新 → 1 最旧

  // 云铺在头顶的半球上——人看天空是抬头看，不是环顾水平线。
  // 新梦低、近、大；旧梦一路飘向天顶，越来越远越来越淡。
  // 三个参数都按梦的 id 抖一下，否则全是 age 的线性函数，云会排成一条螺旋。
  const key = d.id || d.at || String(i);
  const jP = jitter(key, 3), jT = jitter(key, 7), jR = jitter(key, 11);

  const phi = THREE.MathUtils.degToRad(
    70 - age * 44 + (jP - 0.5) * 26);                    // 主趋势 ± 13°
  const theta = i * GOLD * 2.1 + (jT - 0.5) * 1.4;       // 方位角散开 ± 0.7rad
  const r = (19 + age * 33) * (0.78 + jR * 0.46);        // 深度 ± 23%

  const sinP = Math.sin(phi);
  const x = Math.cos(theta) * sinP * r;
  const z = Math.sin(theta) * sinP * r;
  const y = Math.cos(phi) * r + 3;

  const warm = /温|暖|亲|抱|吻|笑|手|近/.test(d.dream + d.residue);
  const heavy = /灰|暗|冷|怕|失|消失|漏|空/.test(d.dream + d.residue);
  const col = warm ? 0xFFF4E2 : heavy ? 0xEDE6FA : 0xFFFFFF;

  const mat = new THREE.SpriteMaterial({
    map: TEX[i % TEX.length], color: col,
    transparent: true, opacity: 1.0 - age*0.38,
    depthWrite: false,
  });
  const sp = new THREE.Sprite(mat);
  const s = (7.5 - age * 3.2) * (0.82 + jitter(key, 17) * 0.4);
  sp.scale.set(s, s*0.6, 1);
  sp.position.set(x, y, z);
  sp.userData = { dream: d, age, home: sp.position.clone(), baseOp: mat.opacity, baseScale: s, i, baseColor: col,
    phase: jitter(key, 23) * 6.283, rate: jitter(key, 29) };
  scene.add(sp);
  clouds.push(sp);
});
document.getElementById('cnt').textContent = `${N} 朵云 · 每朵是一个真实的梦 · 越旧的飘得越高越远`;

/* ── 控制：360° 环视 + 俯仰 + 缩放 ── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 10, 0);           // 视线朝斜上方 40°
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = -0.32;            // 负号：拖动方向跟手
controls.minDistance = 0.5;
controls.maxDistance = 78;
controls.autoRotate = true;              // 不动它，云自己慢慢转过来
controls.autoRotateSpeed = 0.22;
controls.update();

/* ── 选中：云靠近，其余退开 ── */
let picked = null;
const card = document.getElementById('card'), tip = document.getElementById('tip');

function select(sp){
  picked = sp;
  clouds.forEach(c => { c.userData.target = null; });
  if (!sp){ card.classList.remove('on'); tip.style.opacity=1; controls.autoRotate = true; return; }
  controls.autoRotate = false;
  tip.style.opacity = 0;

  const d = sp.userData.dream;
  document.getElementById('c-t').textContent = (d.dream||'').slice(0,14) + '…';
  const t = new Date(d.at);
  const today = new Date().toDateString() === t.toDateString();
  document.getElementById('c-w').textContent =
    (today ? '今天 ' : `${t.getMonth()+1}月${t.getDate()}日 `) +
    String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  const hrs = Math.round((Date.now() - t.getTime())/3.6e6);
  document.getElementById('c-m').innerHTML =
    `<em class="gold">${hrs < 24 ? hrs+' 小时前' : Math.round(hrs/24)+' 天前'}</em>` +
    (d.lucid ? '<em>梦里知道是梦</em>' : '<em>沉睡</em>');
  document.getElementById('c-b').textContent = d.dream || '';
  const r = document.getElementById('c-r');
  r.textContent = d.residue ? '余韵：' + d.residue : '';
  r.style.display = d.residue ? '' : 'none';
  const l = document.getElementById('c-l');
  l.innerHTML = d.lucid ? '<b>梦里的清醒</b>' + d.lucid : '';
  l.style.display = d.lucid ? '' : 'none';
  card.classList.add('on');
}
document.getElementById('c-x').onclick = (e) => { e.stopPropagation(); select(null); };

/* 触屏上 click 不可靠：pointer + 位移判定（拖动看风景 ≠ 想选） */
const ray = new THREE.Raycaster(), pt = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = {x:e.clientX,y:e.clientY,t:Date.now()}; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y), dt = Date.now()-down.t;
  down = null;
  if (moved > 10 || dt > 700) return;
  pt.x = (e.clientX/innerWidth)*2-1; pt.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(pt, camera);
  const hit = ray.intersectObjects(clouds.filter(c => c.visible), false)[0];
  select(hit ? (hit.object === picked ? null : hit.object) : null);
});

/* ── 数量筛选：只留最近 N 朵，其余隐藏 ── */
let limit = 0;   // 0 = 全部
function applyLimit(n){
  limit = n;
  clouds.forEach((c, i) => { c.visible = (n === 0 || i < n); });
  if (picked && !picked.visible) select(null);
  document.getElementById('cnt').textContent =
    `${n === 0 ? clouds.length : Math.min(n, clouds.length)} 朵云 · 每朵是一个真实的梦 · 越旧的飘得越高越远`;
}
document.querySelectorAll('#filters button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
    applyLimit(+b.dataset.n);
  };
});

/* ── 每帧 ── */
const clock = new THREE.Clock();
let lastSunTick = -1;
const focus = new THREE.Vector3();
function frame(){
  const t = clock.getElapsedTime();
  skyMat.uniforms.t.value = t;
  if (Math.floor(t) % 30 === 0 && Math.floor(t) !== lastSunTick) {
    lastSunTick = Math.floor(t);
    SUN = sunAt(new Date());
    skyMat.uniforms.sunDir.value.copy(SUN.dir);
    skyMat.uniforms.day.value = SUN.day;
    skyMat.uniforms.dusk.value = SUN.dusk;
  }

  clouds.forEach((c, i) => {
    const u = c.userData;
    // 各自的漂浮节奏
    const bob = Math.sin(t*(0.26 + u.rate*0.22) + u.phase) * (0.7 + u.age*0.9);
    // 受光：云朝着太阳的那一面亮，背光的沉——转视角时云也跟着变
    const toSun = c.position.clone().normalize().dot(SUN.dir);
    const lit = 0.72 + Math.max(toSun, 0) * 0.28;
    const night = 0.55 + SUN.day * 0.45;
    c.material.color.setHex(u.baseColor).multiplyScalar(lit * night);

    if (c === picked){
      // 选中的云飘到眼前
      focus.copy(camera.position);
      const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
      focus.addScaledVector(dir, 13).setY(camera.position.y + 1.2);
      c.position.lerp(focus, 0.06);
      const s = THREE.MathUtils.lerp(c.scale.x, 7.5, 0.06);
      c.scale.set(s, s*0.6, 1);
      c.material.opacity = THREE.MathUtils.lerp(c.material.opacity, 1, 0.08);
    } else {
      const home = u.home.clone(); home.y += bob;
      c.position.lerp(home, 0.05);
      const s = THREE.MathUtils.lerp(c.scale.x, u.baseScale, 0.06);
      c.scale.set(s, s*0.6, 1);
      const want = picked ? u.baseOp*0.3 : u.baseOp;
      c.material.opacity = THREE.MathUtils.lerp(c.material.opacity, want, 0.08);
    }
  });

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body></html>
